name: smu-core-api CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["dev"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: smu_test
          MYSQL_USER: smu
          MYSQL_PASSWORD: smu1234
          MYSQL_ROOT_PASSWORD: root1234
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build & Test
        env:
          # application.yml이 요구하는 DB_* 형태로 맞춰줌
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: smu_test
          DB_USERNAME: smu
          DB_PASSWORD: smu1234

          # redis placeholders 채움
          REDIS_HOST: localhost
          REDIS_PORT: 6379

          # oauth/app placeholders 더미값(테스트에서 실제 인증 안 하면 더미로 충분)
          GITHUB_CLIENT_ID: dummy
          GITHUB_CLIENT_SECRET: dummy
          LOGIN_SUCCESS_REDIRECT_URI: http://localhost

          # JPA 테스트용
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        run: ./gradlew clean test
