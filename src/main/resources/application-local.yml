spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  elasticsearch:
    uris: http://localhost:9200

logging:
  level:
    com.solvemeup: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

app:
  security:
    csrf:
      enabled: false   # 로컬 개발·테스트 무마찰을 위해 비활성
