name: smu-core-api CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["dev"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build (skip tests)
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: smu_test
          DB_USERNAME: smu
          DB_PASSWORD: smu1234

          REDIS_HOST: localhost
          REDIS_PORT: 6379

          GITHUB_CLIENT_ID: dummy
          GITHUB_CLIENT_SECRET: dummy
          LOGIN_SUCCESS_REDIRECT_URI: http://localhost

          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        run: ./gradlew clean build -x test
