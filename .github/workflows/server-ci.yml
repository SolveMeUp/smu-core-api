name: smu-core-api CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["dev"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: smu_test
          MYSQL_USER: smu
          MYSQL_PASSWORD: smu1234
          MYSQL_ROOT_PASSWORD: root1234
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build & Test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/smu_test
          SPRING_DATASOURCE_USERNAME: smu
          SPRING_DATASOURCE_PASSWORD: smu1234
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
        run: ./gradlew clean build
